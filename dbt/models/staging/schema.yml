version: 2

models:
  - name: stg_user_enrichment
    columns:
      - name: user_id
        tests: [not_null]
      - name: segment
        tests:
          - not_null
          - accepted_values:
              values: ["high_value", "standard", "at_risk", "new"]
      - name: acquisition_channel
        tests:
          - not_null
          - accepted_values:
              values: ["organic", "paid_search", "paid_social", "referral", "email"]
      - name: as_of_date
        tests: [not_null]
      - name: ltv_score
        tests: [not_null]

  - name: stg_orders
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: user_id
        tests: [not_null]
      - name: order_date
        tests: [not_null]
      - name: amount
        tests: [not_null]
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ["completed", "refunded", "pending"]

  - name: stg_product_events
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: user_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              values: ["view", "add_to_cart", "purchase"]
      - name: event_time
        tests: [not_null]
