version: 2

models:
  - name: gold_daily_revenue
    columns:
      - name: metric_date
        tests: [not_null, unique, not_null_unique]
      - name: order_count
        tests: [not_null]
      - name: total_revenue
        tests: [not_null]
      - name: avg_order_value
        tests: [not_null]

  - name: gold_daily_product_engagement
    columns:
      - name: metric_date
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: view_count
        tests: [not_null]
      - name: distinct_users
        tests: [not_null]

  - name: gold_user_ltv_segment_summary
    columns:
      - name: segment
        tests: [not_null, unique]
      - name: user_count
        tests: [not_null]
      - name: total_revenue
        tests: [not_null]
      - name: avg_ltv_score
        tests: [not_null]
