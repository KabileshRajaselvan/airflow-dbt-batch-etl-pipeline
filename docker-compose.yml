services:
  warehouse-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
    ports:
      - "5493:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  source-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sourcedb
      POSTGRES_USER: source
      POSTGRES_PASSWORD: source
    ports:
      - "5494:5432"
    volumes:
      - source_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source -d sourcedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    ports:
      - "5495:5432"
    volumes:
      - airflow_meta_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-api:
    build: ./mock_api
    ports:
      - "8091:8000"

  seed:
    build: ./seed
    depends_on:
      source-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SOURCE_DB_HOST: source-db
      SOURCE_DB_NAME: sourcedb
      SOURCE_DB_USER: source
      SOURCE_DB_PASSWORD: source
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: raw-files
      SEED_DAYS: "14"

  airflow-init:
    build:
      context: .
      dockerfile: dags/Dockerfile
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --password admin
               --firstname Admin --lastname User --role Admin --email admin@example.com"

  airflow-webserver:
    build:
      context: .
      dockerfile: dags/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      MOCK_API_BASE: http://mock-api:8000
      SOURCE_DB_HOST: source-db
      SOURCE_DB_NAME: sourcedb
      SOURCE_DB_USER: source
      SOURCE_DB_PASSWORD: source
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: raw-files
      WAREHOUSE_DB_HOST: warehouse-db
      WAREHOUSE_DB_NAME: warehouse
      WAREHOUSE_DB_USER: warehouse
      WAREHOUSE_DB_PASSWORD: warehouse
      DBT_TARGET: postgres
    ports:
      - "8092:8080"
    volumes:
      - airflow_staging:/opt/airflow/staging
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: dags/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      MOCK_API_BASE: http://mock-api:8000
      SOURCE_DB_HOST: source-db
      SOURCE_DB_NAME: sourcedb
      SOURCE_DB_USER: source
      SOURCE_DB_PASSWORD: source
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: raw-files
      WAREHOUSE_DB_HOST: warehouse-db
      WAREHOUSE_DB_NAME: warehouse
      WAREHOUSE_DB_USER: warehouse
      WAREHOUSE_DB_PASSWORD: warehouse
      DBT_TARGET: postgres
    volumes:
      - airflow_staging:/opt/airflow/staging
    command: scheduler

  api:
    build: ./backend
    depends_on:
      warehouse-db:
        condition: service_healthy
    environment:
      WAREHOUSE_DB_HOST: warehouse-db
      WAREHOUSE_DB_NAME: warehouse
      WAREHOUSE_DB_USER: warehouse
      WAREHOUSE_DB_PASSWORD: warehouse
      CORS_ORIGINS: http://localhost:5220
    ports:
      - "8093:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8093
    depends_on:
      - api
    ports:
      - "5220:5173"

volumes:
  warehouse_data:
  source_data:
  airflow_meta_data:
  minio_data:
  airflow_staging:
